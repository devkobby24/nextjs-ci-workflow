name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      run-prettier:
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: none

jobs:
  format:
    if: ${{ inputs.run-prettier }}
    name: 🧹 Format with Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npx prettier --write .

      - name: Commit formatted files
        id: commit
        run: |
          CHANGED_FILES=$(git status --porcelain | awk '{print $2}')

          if [[ -n "$CHANGED_FILES" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add . ':!**/.github/workflows/**'
            git commit -m "🧹 Format code with Prettier"
            git push origin HEAD:${{ github.head_ref }}

            echo "formatted=true" >> "$GITHUB_OUTPUT"
            {
              echo "changed_files<<EOF"
              printf "%s\n" "$CHANGED_FILES"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "formatted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on PR if formatted
        if: steps.commit.outputs.formatted == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            🧹 Prettier formatted some files automatically!
            ✅ Changes committed back to branch.

            **Files Updated:**
            ```
            ${{ steps.commit.outputs.changed_files }}
            ```

  lint-build-test:
    name: ✅ Build & Test
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (if present)
        run: npm run test --if-present
